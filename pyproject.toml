[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cp-preprocess"
version = "1.0.0"
description = "Config-driven Cell Painting profile preprocessing: Level 2.5 (sites) → Level 5 (consensus), with batch correction, mAP/GRIT and viability."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sofia Hernandez" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",
    "PyYAML>=6.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pycytominer>=1.1",
    "copairs>=0.5",
    "cytominer-eval>=0.1",
    "anndata>=0.10",
    "scanpy>=1.10",
    "harmonypy>=0.0.9",
    "umap-learn>=0.5",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[project.scripts]
cp-run-pipeline = "cp_preprocess.run_pipeline:main"
cp-run-full-pipeline = "cp_preprocess.run_full_pipeline:main"
cp-run-plots = "cp_preprocess.run_analysis_plots:main"

[tool.setuptools]
packages = ["cp_preprocess"]
