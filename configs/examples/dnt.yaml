# Example Configuration for DNT Project
# Adjust metadata columns and thresholds for your specific dataset
#
# All options from config.py are listed here (set to project values, or
# commented showing the default) so nothing is silently defaulted.

project_name: "DNT_Example"

database:
  uri: ""   # leave empty: read from the IMAGEDB_URI environment variable (see README)
  feature_analysis_type: "cp-features"
  qc_analysis_type: "cp-qc"
  use_db: false

data_loading:
  skip_loading: false
  # load_compartments: ["nuclei", "cells", "cytoplasm"]  # default
  # merge_compartments: true                              # default
  use_cache: true
  cache_subdir: "_feature_cache"
  refresh_cache: false
  # compartment_files:                                     # default names
  #   nuclei: "featICF_nuclei.parquet"
  #   cells: "featICF_cells.parquet"
  #   cytoplasm: "featICF_cytoplasm.parquet"

image_qc:
  run: true
  apply_filter: true
  qc_metrics:
    - "FocusScore"
    - "PowerLogLogSlope"
    - "MaxIntensity"
    - "MeanIntensity"
  z_threshold: 5.0
  min_nuclei_per_site: 20
  count_col: "Count_nuclei"

  dmso_site_qc: true
  dmso_min_cells_per_site: 30
  dmso_count_z_threshold: 3.5
  drop_dmso_outliers: true

# ─────────────────────────────────────────────────────────────────────────────
# Manual site drop — explicit override for sites identified by eye (e.g. from
# QC images / low-cell-count review) that image_qc's automated thresholds
# didn't catch. Applied once, right after Level 2.5 is loaded/read — works
# identically whether run via run_full_pipeline.py (fresh load) or
# run_pipeline.py (existing level_2_5.csv).
# ─────────────────────────────────────────────────────────────────────────────
manual_site_drop:
  enabled: false
  # Keys match metadata.barcode_col / well_col / site_col below. "site" is
  # matched as a string. Omit "cell_line" to drop in every cell line in the
  # project; set it to restrict the entry to just that cell line.
  sites: []
  # Example:
  #   sites:
  #     - {barcode: "PB000123", well: "C04", site: "3"}                     # all cell lines
  #     - {barcode: "PB000123", well: "C04", site: "7", cell_line: "U2OS"}  # U2OS only

metadata:
  file_path: "./data/metadata.csv"
  sep: ","

  barcode_col: "Metadata_Barcode"
  well_col: "Metadata_Well"
  cell_line_col: "Metadata_CellLine"
  compound_col: "Metadata_Compound_Name"
  conc_col: "Metadata_conc_uM"
  pert_type_col: "Metadata_pert_type"
  project_col: "Metadata_Project"
  site_col: "Metadata_Site"

  # Optional: ID columns to extract from metadata
  qc_id_col: null  # e.g., "Metadata_pipeline_id_qc"
  feat_id_col: null  # e.g., "Metadata_pipeline_id_feat_texture"
  plate_acq_id_col: null  # e.g., "Metadata_plate_acquisition_id"

  # Harmonize cell line names if needed
  cell_line_rename:
    "HOG": "HOG"
    "SK-N-SH": "SKNSH"
    "SH-SY5Y": "SHSY5Y"

  # Process these cell lines (null = all in metadata)
  cell_lines:
    - "HOG"
    - "SKNSH"
    - "SHSY5Y"

  plate_name_overrides: {}
  plate_acq_id_overrides: {}

aggregation:
  operation: "median"
  min_cells_per_site: 20
  min_dmso_cells_per_site: 20
  min_cells_per_well: 50

normalization:
  method: "mad_robustize"
  samples_query: "Metadata_pert_type == 'negcon'"
  invariant_filter_reference_query: "Metadata_pert_type == 'negcon'"
  mad_threshold: 0.001
  clip_min: -10.0
  clip_max: 10.0

  blocklist_patterns:
    - ["Granularity_12", "_nucleus"]
    - ["Correlation_Manders", "_nucleus"]
    - ["Correlation_Manders", "_cytoplasm"]
    - ["Correlation_RWC", "_nucleus"]
  # (added: code default — this field exists in config.py but was missing here)
  dmso_center_tolerance: 0.5  # flag plates whose mean DMSO feature value after normalization exceeds ±this

feature_selection:
  operations:
    - "variance_threshold"
    - "drop_na_columns"
    - "correlation_threshold"
    - "drop_outliers"

batch_correction:
  run: true
  method: "spherize"  # "spherize" (default) | "combat" | "harmony"
  plate_col: "Metadata_Barcode"

  # How positional effects are modeled and removed (opt-in only — leave as
  # "barcode" unless QC plots show a row/column effect worth removing):
  #   "barcode"            — plate only, no covariates (default)
  #   "barcode_row"        — also preserve well row (A–P)
  #   "barcode_column"     — also preserve well column (1–24)
  #   "barcode_row_column" — preserve both row and column
  batch_effect_fix: "barcode"

  min_dmso_per_plate: 3

  regress_out_column: false
  column_min_dmso: 4


consensus:
  operation: "modz"
  aggregation_method: "median"
  replicate_cols: []  # empty = derive from metadata.compound_col + conc_col

metrics:
  compute_map: true
  map_null_size: 500
  map_fdr_threshold: 0.05

  compute_consistency: false
  consistency_col: "Metadata_moa"
  consistency_null_size: 500
  consistency_fdr_threshold: 0.05

  compute_grit: true
  compute_reproducibility: true

  grit_flag_threshold: 1.0  # NOTE: field is grit_flag_threshold, not grit_threshold
  viability_threshold_pct: 0.80
  viability_site_count_col: "Metadata_Count_nuclei"
  viability_dmso_z_threshold: 3.0
  viability_min_sites: 2

  pca_variance_explained: 0.95

  negcon_value: "negcon"
  poscon_value: "poscon"
  pert_type_col: "Metadata_pert_type"


# mahalanobis — section added for schema parity (code defaults; behaviour unchanged)
mahalanobis:
  run: false  # opt-in OASIS-style per-plate Mahalanobis distance to DMSO (mahalanobis_distance.py)
  level: "4b"  # "4b" (pre batch correction) or "4c"
  cover_var: 0.95  # PCA explained variance to retain
  min_dmso_wells: 4  # min DMSO wells per plate to compute MD
  keep_poscon: false  # keep poscon rows in the output
  compartments: ["Nuclei", "Cells", "Cytoplasm"]
  seed: 42


# site_level — section added for schema parity (code defaults; behaviour unchanged)
site_level:
  run: false  # opt-in Level 2.5a/2.5b (site-level normalization + feature selection)


# profile_metrics — section added for schema parity (code defaults; behaviour unchanged)
profile_metrics:
  run: false  # opt-in standalone profile_metrics.py on Level 4b
  compute_activity: true
  active_percentile: 95.0
  compute_matching: true
  query_compound: null
  similarity_threshold: 90.0
  plot_profile: false
  top_n_var: 40
  dmso_compound: "DMSO"

output:
  base_dir: "."
  skip_existing: true
  features_subdir: "features"
  qc_subdir: "qc"
  plots_subdir: "plots"

compound_col_map: {}
conc_col_map: {}

run_batch_correction: true
run_from_level4_only: false
run_metrics_for_level5_only: true
